# Every push and pull request: the Python checks on every released Python
# millwork allows, the tests again on the oldest dependencies it allows, the
# bundle's checks, and a build that must reproduce the committed bundle.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # Every Python from the oldest allowed to the newest released on Linux,
      # and the two ends of that range on Windows and macOS. A new Python is
      # added here when it is released.
      matrix:
        os: [ubuntu-latest]
        python: ["3.12", "3.13", "3.14", "3.15"]
        include:
          - os: windows-latest
            python: "3.12"
          - os: windows-latest
            python: "3.15"
          - os: macos-latest
            python: "3.12"
          - os: macos-latest
            python: "3.15"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check src scripts tests
      - run: uv run ruff format --check src scripts tests
      - run: uv run mypy src
      - run: uv run pytest -q

  # The lower bounds in pyproject.toml are a promise too. The lockfile holds
  # the newest versions, so this job resolves on its own: every dependency
  # millwork names at the lowest version it allows, on the oldest Python.
  oldest:
    name: Oldest allowed dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv venv
      - run: uv pip install --resolution lowest-direct --editable ".[dev]" --group dev
      - run: uv pip list
      - run: .venv/bin/python -m pytest -q

  bundle:
    name: Bundle
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bundle
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.15.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: bundle/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc -b
      - run: pnpm exec vitest run
      - run: pnpm build
      - name: The committed bundle is the built bundle
        working-directory: .
        run: |
          if [ -n "$(git status --porcelain src/millwork/_bundle/dist)" ]; then
            git status --porcelain src/millwork/_bundle/dist
            echo "src/millwork/_bundle/dist differs from a fresh build; run the build and commit it" >&2
            exit 1
          fi
