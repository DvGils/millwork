# Every push and pull request: the Python checks on two interpreters, the
# bundle's checks, and a build that must reproduce the committed bundle.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.12", "3.13"]
        include:
          - os: windows-latest
            python: "3.12"
          - os: macos-latest
            python: "3.12"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check src tests
      - run: uv run ruff format --check src tests
      - run: uv run mypy src
      - run: uv run pytest -q

  bundle:
    name: Bundle
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bundle
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.15.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: bundle/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit
      - run: pnpm exec vitest run
      - run: pnpm build
      - name: The committed bundle is the built bundle
        working-directory: .
        run: |
          if [ -n "$(git status --porcelain src/millwork/_bundle/dist)" ]; then
            git status --porcelain src/millwork/_bundle/dist
            echo "src/millwork/_bundle/dist differs from a fresh build; run the build and commit it" >&2
            exit 1
          fi
