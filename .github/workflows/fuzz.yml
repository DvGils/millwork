# Every night: the lifecycle fuzzer on seeds nobody has run before. Each
# day's run starts where the date puts it, so a scenario that breaks a
# promise is found once and can be replayed by its seed.
name: Fuzz

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      seeds:
        description: scenarios per process
        default: "4000"
      steps:
        description: actions per scenario
        default: "70"

permissions:
  contents: read

jobs:
  fuzz:
    name: Scenarios ${{ matrix.part }} of 4
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        part: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked
      - name: Run the scenarios
        env:
          SEEDS: ${{ inputs.seeds || '4000' }}
          STEPS: ${{ inputs.steps || '70' }}
        run: |
          # The day's number, times the seeds of a whole night, plus this part's share.
          day=$(( $(date -u +%s) / 86400 ))
          start=$(( day * SEEDS * 4 + ${{ matrix.part }} * SEEDS ))
          echo "seeds $start to $(( start + SEEDS - 1 )), $STEPS actions each"
          uv run python tests/lifecycle_fuzz.py --start "$start" --seeds "$SEEDS" --steps "$STEPS"
      - name: Show the smallest scenario of each failure
        if: failure()
        env:
          SEEDS: ${{ inputs.seeds || '4000' }}
          STEPS: ${{ inputs.steps || '70' }}
        run: |
          day=$(( $(date -u +%s) / 86400 ))
          start=$(( day * SEEDS * 4 + ${{ matrix.part }} * SEEDS ))
          uv run python tests/lifecycle_fuzz.py --start "$start" --seeds "$SEEDS" --steps "$STEPS" --shrink | head -200
