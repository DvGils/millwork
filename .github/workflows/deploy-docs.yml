# The hosted manual follows the releases: the release workflow starts this
# one with the version it published, and the image installs that release's
# own wheel, the same file that went to PyPI. It also runs for a release
# made by hand on GitHub, and by hand with a version.
name: Deploy docs

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "the millwork version to deploy, as on PyPI"
        required: true

permissions:
  contents: read

concurrency:
  group: deploy-docs
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: The version to deploy
        env:
          TAG: ${{ github.event.release.tag_name }}
          INPUT: ${{ github.event.inputs.version }}
        run: |
          version="${INPUT:-${TAG#v}}"
          if [ -z "$version" ]; then
            echo "no version: run from a release or give one" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_ENV"

      # The release's wheel, so the deploy never waits for PyPI's index.
      - name: The wheel from the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "v$version" --pattern "millwork-*.whl" --dir deploy && ls -l deploy

      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # 1.6
        with:
          version: "0.5.1"
      - name: Deploy
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        working-directory: deploy
        run: flyctl deploy --remote-only
