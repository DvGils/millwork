# A tag v* releases that commit. The job waits in the release environment for
# approval, proves the tag is the version in pyproject.toml and the committed
# bundle is a fresh build, runs the checks, builds the wheel, publishes it to
# PyPI through Trusted Publishing and makes the GitHub release from the
# changelog section for the version.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write # the GitHub release
      id-token: write # Trusted Publishing and provenance
      attestations: write
      actions: write # start the docs deploy
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
          enable-cache: true

      - name: The tag is the version in pyproject.toml
        run: |
          version="$(uv version --short)"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "the tag is $GITHUB_REF_NAME but pyproject.toml says $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_ENV"

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.15.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: bundle/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: bundle
      - run: pnpm exec tsc --noEmit && pnpm exec vitest run && pnpm build
        working-directory: bundle
      - name: The committed bundle is the built bundle
        run: |
          if [ -n "$(git status --porcelain src/millwork/_bundle/dist)" ]; then
            git status --porcelain src/millwork/_bundle/dist
            echo "src/millwork/_bundle/dist differs from a fresh build" >&2
            exit 1
          fi

      - run: uv sync --locked
      - run: uv run ruff check src tests && uv run ruff format --check src tests
      - run: uv run mypy src
      - run: uv run pytest -q

      - name: Build the wheel
        run: |
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          uv build --wheel --out-dir dist
          ls -l dist

      # The release body is the curated section of CHANGELOG.md for this
      # version, not a commit list.
      - name: Release notes from CHANGELOG.md
        run: |
          awk -v ver="$version" '
            /^## / { if (found) exit; if ($2 == ver) { found=1; next } }
            found { print }
          ' CHANGELOG.md > RELEASE_NOTES.md
          if [ ! -s RELEASE_NOTES.md ]; then
            echo "CHANGELOG.md has no section for $version" >&2
            exit 1
          fi
          cat RELEASE_NOTES.md

      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.whl

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.whl --title "millwork $version" --notes-file RELEASE_NOTES.md

      # A release this job creates starts no other workflow on its own: GitHub
      # does not chain runs made with the workflow token. The deploy is asked
      # for by name, which is the one kind of start that is allowed.
      - name: Deploy the docs
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-docs.yml --ref "$GITHUB_REF_NAME" -f "version=$version"
