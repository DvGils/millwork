# The manual on Fly.io, one small machine that stays up: a visitor's open
# socket is the session, so the machine is not stopped when HTTP goes quiet.
app = "millwork-docs"
primary_region = "ams"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/_mw/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
